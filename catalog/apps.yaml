# iOS 18 Stock Apps Catalog for iphone-hand
# Target Device: iPhone XS (iOS 18, English UI)
# Coordinate System & Landmark Resolution: 375x812 pt (screen scale 2x/3x)
# Claim status key:
#   - read: Verified via Apple Documentation, HIG, or iOS 18 system specifications
#   - measured: Directly observed from test fixtures in this repo
#   - unknown - verify on device: Subject to initial setup state, permissions, or device config

version: "1.0.0"
os_version: "iOS 18"
locale: "en_US"

apps:
