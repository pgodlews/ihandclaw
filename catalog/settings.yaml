# iOS 18 Settings Destinations Catalog for iphone-hand
# Target Device: iPhone XS (iOS 18, English UI)
# Coordinate System & Landmark Resolution: 375x812 pt
#
# Rules & Attribution:
#   - spotlight_direct_status:
#       * 'read' (with an Apple source URL): Apple officially documents Spotlight finding/opening this setting directly.
#       * 'unknown - verify on device': Behavior on an actual device must be tested (e.g. deep-pane jumps, hardware dependencies).
#   - status: Overall verification level of the navigation path and OCR landmarks.

version: "1.0.0"
os_version: "iOS 18"
locale: "en_US"

destinations:
  - id: wifi
    display_name: "Wi-Fi"
    navigation_path:
      - "Settings"
      - "Wi-Fi"
    spotlight_query: "Wi-Fi"
    spotlight_jumps_directly: true
    spotlight_direct_status: "read"
    spotlight_source_url: "https://support.apple.com/guide/iphone/find-settings-iph3bd391559/ios"
    landmark_texts:
      - "Wi-Fi"
      - "NETWORKS"
      - "Ask to Join Networks"
      - "Auto-Join Hotspot"
    status: "read"
    notes: "Spotlight indexing provides direct shortcut to Wi-Fi pane or quick switch."

