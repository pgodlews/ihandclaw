<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone Hand</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e5eef4;background:#101820;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:1100px;margin:auto}h1{font-size:1.35rem;margin:0}header,.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #587080;background:#203140;color:inherit}button{cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible{outline:2px solid #7de6ec}button:disabled{opacity:.5;cursor:wait}#kill{background:#b32635;font-weight:bold;margin-left:auto}#status{width:100%;color:#aabec9;font-size:.9rem;overflow-wrap:anywhere}.layout{display:grid;grid-template-columns:minmax(260px,480px) minmax(220px,1fr);gap:20px}.view{position:relative;width:100%;aspect-ratio:375/812;background:#000;border-radius:16px;overflow:hidden}#live{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}label{display:inline-flex;gap:6px;align-items:center;padding:4px}input[type=checkbox]{width:20px;height:20px}#log{padding-left:22px;font-size:.9rem;max-height:420px;overflow:auto}#message{min-height:2em;color:#ffdb99;overflow-wrap:anywhere}.note{font-size:.85rem;color:#aabec9}form{display:flex;gap:8px;margin-top:12px}form input{min-width:0;flex:1}@media(max-width:640px){body{padding:10px}.layout{grid-template-columns:1fr}.view{max-width:375px;margin:auto}.controls{gap:6px}#kill{margin-left:0}#log{max-height:180px}}
#mirrorNotice{position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;color:#e5eef4;background:#101820}#mirrorNotice[hidden]{display:none}
</style>
<main><header><h1>iPhone Hand</h1><button id="kill" aria-pressed="false">Pause actions</button><div id="status" role="status">Connecting…</div></header>
<div class="controls"><button data-action="home">Home</button><button data-action="spotlight">Spotlight</button><button data-action="back">Back</button><label><input id="keyboard" type="checkbox">Keyboard passthrough: <span id="keyboardState">OFF</span></label><label><input id="overlay" type="checkbox">Pointer + elements</label></div>
<div class="layout"><div class="view"><img id="live" tabindex="0" alt="Live mirrored iPhone. Click to tap; drag to swipe." draggable="false"><canvas id="marks" width="750" height="1624"></canvas><div id="mirrorNotice" role="status">Checking mirroring…</div></div><aside><div id="message" role="alert"></div><p class="note">Click to tap, drag to swipe, wheel to scroll. Coordinates use the whole mirrored frame. Keyboard control is off until enabled. Pause stops further reports; an already queued board report can finish.</p><form id="launch"><input id="appName" placeholder="App or shortcut name" aria-label="App name" maxlength="200" required><button>Launch</button></form><form id="type"><input id="text" placeholder="Type text (password guard active)" aria-label="Text to type" maxlength="4096" autocomplete="off" required><button>Type</button></form><h2 style="font-size:1rem">Action log</h2><ol id="log"></ol></aside></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);
const token=q.get('token')||sessionStorage.getItem('iphone-hand-token');
if(token)sessionStorage.setItem('iphone-hand-token',token);
let paused=false,position=null,elementData=[],overlayBusy=false,queue=Promise.resolve(),epoch=0;
const message=s=>$('message').textContent=s;
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});const value=await r.json();if(!r.ok)throw Error(value.error||('HTTP '+r.status));return value;}
function action(name,args={}){const generation=epoch;queue=queue.catch(()=>{}).then(async()=>{if(generation!==epoch)return;if(paused)throw Error('Actions are paused');const r=await api('/api/'+name,args);message('');renderState(r.state);}).catch(e=>message(e.message));return queue;}
function renderState(s){if(!s)return;paused=s.paused;const a=s.airplay||{},b=s.ble||{};position=s.pointer;$('mirrorNotice').hidden=!!a.mirroring;$('mirrorNotice').textContent='Not mirroring - on the iPhone: Control Center > Screen Mirroring > '+(a.receiver_name||'iPhone Hand');$('live').style.visibility=a.mirroring?'visible':'hidden';$('marks').style.visibility=a.mirroring?'visible':'hidden';$('kill').textContent=paused?'Resume actions':'Pause actions';$('kill').setAttribute('aria-pressed',String(paused));$('status').textContent=`Mirror ${a.mirroring?'active':'waiting'} · ${(a.fps||0).toFixed(1)} fps · BLE ${b.ready?'ready':b.conn?'connected':'offline'} · link ${(s.link||{}).connected?'up':'down'} · pointer ${position?position.x.toFixed(1)+', '+position.y.toFixed(1)+' pt':'unavailable'}${paused?' · PAUSED':''}`;const log=$('log');log.replaceChildren();for(const entry of (s.action_log||[]).slice().reverse()){const li=document.createElement('li');li.textContent=new Date(entry.time*1000).toLocaleTimeString()+' '+entry.action+' '+(entry.ok?'OK':entry.error)+' ('+Math.round(entry.duration_ms)+' ms)';log.append(li);}draw();}
function draw(){const c=$('marks').getContext('2d');c.clearRect(0,0,750,1624);if(!$('overlay').checked)return;c.font='22px system-ui';c.lineWidth=2;for(const e of elementData){const [l,t,r,b]=e.bounds_pt;c.strokeStyle='#7de6ec';c.strokeRect(l*2,t*2,(r-l)*2,(b-t)*2);c.fillStyle='#101820';c.fillRect(l*2,t*2,Math.max(45,e.id.length*14),26);c.fillStyle='#7de6ec';c.fillText(e.id,l*2+2,t*2+21);c.beginPath();c.arc(e.center[0]*2,e.center[1]*2,4,0,Math.PI*2);c.fill();}if(position){c.strokeStyle='#ffde67';c.lineWidth=3;c.beginPath();c.arc(position.x*2,position.y*2,35,0,Math.PI*2);c.stroke();}}
function point(e){const r=$('live').getBoundingClientRect();return [Math.max(0,Math.min(375,(e.clientX-r.left)*375/r.width)),Math.max(0,Math.min(812,(e.clientY-r.top)*812/r.height))];}
let down=null;
$('live').addEventListener('pointerdown',e=>{if(paused||e.button!==0)return;e.preventDefault();$('live').focus({preventScroll:true});down={point:point(e),time:performance.now(),id:e.pointerId};$('live').setPointerCapture(e.pointerId);});
$('live').addEventListener('pointerup',e=>{if(!down||down.id!==e.pointerId)return;const start=down;down=null;const [x,y]=point(e),[x1,y1]=start.point;if(Math.hypot(x-x1,y-y1)>6)action('drag',{x1,y1,x2:x,y2:y,steps:10});else if(performance.now()-start.time>650)action('long_press',{x,y,ms:800});else action('tap',{x,y});});
$('live').addEventListener('pointercancel',()=>down=null);
let wheel=0,wheelTimer=null,wheelPoint=null;
$('live').addEventListener('wheel',e=>{e.preventDefault();wheel+=Math.sign(e.deltaY);wheelPoint=point(e);if(!wheelTimer)wheelTimer=setTimeout(()=>{if(wheel){const [x,y]=wheelPoint;action('scroll',{dy:Math.max(-10,Math.min(10,-wheel)),x,y});}wheel=0;wheelTimer=null;},120);},{passive:false});
for(const button of document.querySelectorAll('[data-action]'))button.onclick=()=>button.dataset.action==='spotlight'?action('key',{combo:'cmd+space'}):action(button.dataset.action);
$('kill').onclick=async()=>{epoch++;try{renderState(await api('/api/pause',{paused:!paused}));message('');}catch(e){message(e.message);}};
$('keyboard').onchange=()=>{$('keyboardState').textContent=$('keyboard').checked?'ON':'OFF';if($('keyboard').checked)$('live').focus({preventScroll:true});};
document.addEventListener('keydown',e=>{if(!$('keyboard').checked||paused||e.target.closest('input,textarea,button')||e.isComposing)return;if(['Meta','Shift','Alt','Control'].includes(e.key))return;const names={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Escape:'esc',Enter:'enter',Backspace:'backspace',Delete:'delete',Tab:'tab',' ':'space'};const name=names[e.key]||(e.key==='+'?'plus':e.key.toLowerCase());if(e.key.length!==1&&!names[e.key])return;e.preventDefault();if(e.key.length===1&&!e.metaKey&&!e.ctrlKey&&!e.altKey)action('type',{text:e.key});else action('key',{combo:[e.metaKey?'cmd':null,e.ctrlKey?'ctrl':null,e.altKey?'alt':null,e.shiftKey?'shift':null,name].filter(Boolean).join('+')});});
$('launch').onsubmit=e=>{e.preventDefault();action('launch',{app:$('appName').value});};$('type').onsubmit=e=>{e.preventDefault();const text=$('text').value;$('text').value='';action('type',{text});};
$('overlay').onchange=()=>{if(!$('overlay').checked)elementData=[];draw();};
async function poll(){try{renderState(await api('/api/state'));}catch(e){message(e.message);}setTimeout(poll,1000);}
async function pollElements(){if($('overlay').checked&&!overlayBusy){overlayBusy=true;try{const data=await api('/api/elements');elementData=data;draw();}catch(e){message(e.message);}finally{overlayBusy=false;}}setTimeout(pollElements,1000);}
if(token){$('live').src='/api/stream.mjpeg?token='+encodeURIComponent(token);poll();pollElements();}else message('Open the authenticated page URL with ?token= from your daemon configuration.');
</script></html>
